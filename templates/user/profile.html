{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Update Profile</h2>

    <form method="POST">

        <input type="text" name="name" value="{{ user.name }}" placeholder="Name" required>

        <input type="tel" name="phone" value="{{ user.phone }}" placeholder="Phone" required>

        <button type="submit">Update Profile</button>

    </form>

    <a href="{{ url_for('user.user_dashboard') }}">Dashboard</a>

</div>

{% endblock %}
