{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Edit Trek: {{ trek.name }}</h2>

    <form method="POST">

        <p>Current Status: {{ trek.status }}</p>

        <p>Change Status to:</p>

        <select name="status" required>

            {% if not allowed_next %}
                <option value="{{ trek.status }}" selected>{{ trek.status }} (no further changes allowed)</option>
            {% endif %}

            {% for s in allowed_next %}
                <option value="{{ s }}">{{ s }}</option>
            {% endfor %}

        </select>

        <p>Current status: {{ trek.status }}</p>

        <p>Available Slots</p>

        <input name="available_slots" type="number" value="{{ trek.available_slots }}" required>

        <button type="submit">Update</button>

    </form>

    <a href="{{ url_for('staff.staff_treks') }}">Back to Treks</a>

</div>

{% endblock %}
