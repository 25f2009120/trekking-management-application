{% extends "base.html" %}

{% block head %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

{% endblock %}

{% block content %}

    <div class="container">

        <div class="card">

            <div class="card-body">

                <h2>Login</h2>

                <form method="POST">

                    <input
                        type="email"
                        name="email"
                        placeholder="example@123.com"
                        required>

                    <input
                        type="password"
                        name="password"
                        placeholder="Password"
                        required>

                    <button type="submit" class="btn btn-primary">
                        Login
                    </button>

                </form>

            </div>

        </div>

    </div>

{% endblock %}
