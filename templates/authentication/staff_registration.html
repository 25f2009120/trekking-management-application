{% extends "base.html" %}

{% block head %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

{% endblock %}

{% block content %}

    <div class="container">

        <div class="card">

            <div class="card-body">

            <h2>Staff Registration</h2>

            <form method="POST">

                <input
                    type="text"
                    name="name"
                    placeholder="Priyank Rajeshkumar Chapadiya"
                    required>

                <input
                    type="email"
                    name="email"
                    placeholder="example@123.com"
                    required>

                <input
                    type="number"
                    name="phone"
                    placeholder="+91 00000 00000"
                    required>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    required>

                <button type="submit" class="btn btn-primary">
                    Register
                </button>

            </form>

            <p>Wait for approval</p>

            </div>

        </div>

    </div>

{% endblock %}
