{% extends "base.html" %}

{% block content %}

<div class="card">

    <h2>Staff Approvals</h2>

    {% if unapproved_staff %}

        <table>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>

            {% for staff in unapproved_staff %}

            <tr>
                <td>{{ staff.name }}</td>
                <td>{{ staff.email }}</td>
                <td>{{ staff.phone }}</td>
                <td>
                    <form method="POST" action="{{ url_for('admin.approve_staff', user_id=staff.id) }}">
                        <button type="submit">Approve</button>
                    </form>
                </td>
            </tr>

            {% endfor %}
        </table>

    {% else %}

    <p>No requests to approve.</p>

    {% endif %}

    <a href="{{ url_for('admin.admin_dashboard') }}">Dashboard</a>

</div>

{% endblock %}
